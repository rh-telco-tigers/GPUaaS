kind: Kueue
apiVersion: kueue.openshift.io/v1
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kueue-operator
  name: cluster
spec:
  config:
    integrations:
      frameworks:
        - BatchJob
        - Deployment
        - StatefulSet
        - PyTorchJob
        - RayCluster
        - RayJob
        - TrainJob
  managementState: Managed