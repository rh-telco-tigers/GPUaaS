# Phase 3 — Training borrows 1 idle GPU from inference (exceeds nominal 1)
apiVersion: batch/v1
kind: Job
metadata:
  name: training-job-2
  namespace: gpuaas-cohort-demo
  labels:
    kueue.x-k8s.io/queue-name: training-queue
    demo.phase: "3"
spec:
  suspend: true
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: training-queue
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: registry.access.redhat.com/ubi9/ubi
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== training-job-2 (borrowed from inference) ==="
              echo "Node: $HOSTNAME"
              END=$((SECONDS+1800))
              while [ $SECONDS -lt $END ]; do
                echo "--- $(date) ---"
                nvidia-smi 2>/dev/null || echo "(nvidia-smi unavailable)"
                sleep 10
              done
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
