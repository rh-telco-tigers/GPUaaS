apiVersion: batch/v1
kind: Job
metadata:
  name: high-priority-inference-job
  namespace: gpuaas-demo
  labels:
    kueue.x-k8s.io/queue-name: inference-queue
    kueue.x-k8s.io/priority-class: high-priority
spec:
  suspend: true
  parallelism: 2
  completions: 2
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: inference-queue
        kueue.x-k8s.io/priority-class: high-priority
    spec:
      restartPolicy: Never
      containers:
        - name: inference
          image: registry.access.redhat.com/ubi9/ubi
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "=== Job: high-priority-inference-job (high-priority: 1000) ==="
              echo "Node: $NODE_NAME"
              echo "GPUs requested: 3"
              echo ""
              END=$((SECONDS+300))
              while [ $SECONDS -lt $END ]; do
                echo "--- $(date) ---"
                nvidia-smi
                echo ""
                sleep 5
              done
              echo "=== Job complete after 5 minutes ==="
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"                    
            limits:
              nvidia.com/gpu: "1"